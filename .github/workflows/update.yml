name: Automated Global Edge Latency & QoS Telemetry Pipeline

on:
  schedule:
    # Runs every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: "edge-telemetry-pipeline"
  cancel-in-progress: true

jobs:
  run-telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Telemetry Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Deploy Headless Network Probe Engine
        run: |
          curl -sL "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/mihomo-linux-amd64-compatible-v1.19.32.gz" -o probe_engine.gz
          gzip -d probe_engine.gz
          mv probe_engine mihomo
          chmod +x mihomo
          ./mihomo -v

      - name: Execute Distributed Topology Aggregation & RTT Benchmark
        run: |
          python update_pool.py

      - name: Publish Network Topology Manifest & Metrics to Edge CDN
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
